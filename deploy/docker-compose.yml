services:
  postgres:
    image: postgres:16
    container_name: racegame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: racegame_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - racegame-postgres:/var/lib/postgresql/data
      - ../Database/DeployInit:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racegame_app -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: racegame-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    volumes:
      - racegame-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: racegame-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=postgres;Username=racegame_app;Password=${DB_PASSWORD}
      Redis__Connection: redis:6379
      Redis__Password: ${REDIS_PASSWORD}
      Jwt__Issuer: RaceGame.Production
      Jwt__Audience: RaceGame.App
      Jwt__Key: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      AllowedHosts: ${API_ALLOWED_HOSTS:?set API_ALLOWED_HOSTS in .env}
    ports:
      - "8080:8080"

  admin:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.admin
    container_name: racegame-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=postgres;Username=racegame_app;Password=${DB_PASSWORD}
      RACEGAME_ADMIN_USERNAME: ${RACEGAME_ADMIN_USERNAME:?set RACEGAME_ADMIN_USERNAME in .env}
      RACEGAME_ADMIN_PASSWORD: ${RACEGAME_ADMIN_PASSWORD:?set RACEGAME_ADMIN_PASSWORD in .env}
      AllowedHosts: ${ADMIN_ALLOWED_HOSTS:-admin.example.com}
    ports:
      - "8081:8081"

volumes:
  racegame-postgres:
  racegame-redis:
